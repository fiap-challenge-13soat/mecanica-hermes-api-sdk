name: Publish to GitHub Packages

# Triggers:
#   1. push tag v*.*.* — release oficial (versão definida pela tag)
#   2. workflow_dispatch — publish manual com input de versão

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex: 1.0.0-preview2)"
        required: true
        default: "1.0.0-preview1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Determinar versão
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolvendo versão: $VERSION"

      - name: Restore
        run: dotnet restore Mecanica.Hermes.Shared.slnx

      - name: Build
        run: dotnet build Mecanica.Hermes.Shared.slnx -c Release --no-restore /p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test Mecanica.Hermes.Shared.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack Mecanica.Hermes.Shared.slnx -c Release --no-build -o ./artifacts /p:Version=${{ steps.version.outputs.version }}

      - name: Upload nupkgs (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs-${{ steps.version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 90

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/fiap-challenge-13soat/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
