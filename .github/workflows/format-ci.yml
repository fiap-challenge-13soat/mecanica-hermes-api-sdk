name: Format CI

on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"

jobs:
  format:
    name: Verificar formatação
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Mecanica.Hermes.Shared.slnx

      - name: Verificar whitespace
        run: dotnet format whitespace Mecanica.Hermes.Shared.slnx --verify-no-changes --no-restore --verbosity diagnostic
